<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Linear issue actions</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:16px}.eyebrow,dt,.scope{color:GrayText;font-size:12px}h2{font-size:18px;margin:4px 0 16px}dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 16px}dd{margin:2px 0 0;font-size:14px;font-weight:600}.scope{font-size:14px;line-height:1.45}.actions{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid color-mix(in srgb,CanvasText 24%,transparent);border-radius:8px;background:transparent;color:CanvasText;cursor:pointer;font:inherit;font-size:13px;font-weight:650;padding:8px 10px}</style></head><body><main aria-live="polite"><div class="eyebrow" id="issue-id">Linear issue</div><h2 id="title">Loading issue…</h2><dl><div><dt>Status</dt><dd id="status">—</dd></div><div><dt>Assignee</dt><dd id="assignee">—</dd></div><div><dt>Cycle</dt><dd id="cycle">—</dd></div><div><dt>Priority</dt><dd id="priority">—</dd></div></dl><p class="scope" id="scope"></p><div class="actions"><button data-action="review">Review brief</button><button data-action="figma" id="figma-action" hidden>Review Figma context</button><button data-action="comment">Draft progress comment</button><button data-action="field">Prepare field change</button></div></main><script>let issue;let nextRequestId=1;const pending=new Map();function request(method,params){return new Promise((resolve,reject)=>{const id=nextRequestId++;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}function render(data){if(!data)return;issue=data;for(const key of["issueId","title","status","assignee","cycle","priority","scope"]){const node=document.getElementById(key==="issueId"?"issue-id":key);if(node)node.textContent=data[key]||"—"}document.getElementById("figma-action").hidden=!data.figmaUrl}window.addEventListener("message",event=>{const message=event.data||{};if(message.id&&pending.has(message.id)){const handler=pending.get(message.id);pending.delete(message.id);message.error?handler.reject(message.error):handler.resolve(message.result)}if(message.method==="ui/notifications/tool-result")render(message.params?.structuredContent)},{passive:true});document.querySelectorAll("[data-action]").forEach(button=>button.addEventListener("click",async()=>{if(!issue?.issueId)return;const prompts={review:`Review the scope and context for ${issue.issueId}. Do not update Linear.`,figma:`Review the Figma context linked from ${issue.issueId}. Do not update Linear.`,comment:`Draft a concise progress comment for ${issue.issueId}. Do not post it.`,field:`I want to change a field on ${issue.issueId}. Ask which field and value, then wait for explicit approval before updating Linear.`};await request("ui/message",{message:prompts[button.dataset.action]})}))</script></body></html>
